{% set name = "silly" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/cube-drone/{{ name }}/archive/refs/tags/{{ version }}.tar.gz
  sha256: 7692a493c2285b8ebdd55a76cc0f17c4cffe88eb1d67a87e8f7e08b2bce58fbd

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  build:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - inflect >=2.1.0
    - python >={{ python_min }}
    - six

test:
  imports:
    - silly
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/cube-drone/silly
  summary: A python library for producing fanciful test data.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
